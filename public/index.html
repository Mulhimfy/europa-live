<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Europa Live — see anywhere in Europe, right now</title>
<meta name="description" content="Click anywhere in Europe and see it right now: live webcams and traffic CCTV, live satellite, rain radar, lightning, aircraft and ships overhead, and the conditions on the ground.">
<meta name="theme-color" content="#06080f">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="vendor/maplibre-gl.js" as="script">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="map" role="application" aria-label="Map of Europe. Click anywhere to see it live."></div>

<header class="topbar">
  <div class="brand" title="Europa Live"><div class="globe"></div><h1>EUROPA<span>LIVE</span></h1></div>
  <div class="search">
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Any city, street, beach, peak, square in Europe…" autocomplete="off" spellcheck="false" aria-label="Search a place in Europe" aria-autocomplete="list" aria-controls="results">
      <kbd>/</kbd>
      <button class="locate" id="locate" title="Use my location" aria-label="Use my location"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
    </div>
    <ul id="results" class="results" role="listbox" hidden></ul>
  </div>
</header>

<div class="hint" id="hint"><span class="dot"></span><span><b>Click anywhere in Europe</b> to see it live — cameras, satellite, sky, aircraft, ground</span></div>

<div class="dock" id="dock">
  <div class="row" id="live-layers"></div>
  <div class="row">
    <div class="group" id="base-layers"></div>
    <div class="scrub" id="scrub">
      <button class="play" id="scrub-play" aria-label="Play or pause the satellite loop">▶</button>
      <input type="range" id="scrub-range" min="0" max="0" value="0" aria-label="Satellite frame">
      <div class="t" id="scrub-time">—</div>
    </div>
  </div>
</div>

<div class="status" id="status"><span class="pill" id="clock">—</span><span class="pill" id="net">connecting…</span><span class="pill"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a> · <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> · <a href="https://www.eumetsat.int" target="_blank" rel="noopener">EUMETSAT</a></span></div>

<aside id="panel" class="panel" aria-label="Live view of the selected place" aria-live="polite">
  <div class="panel-head">
    <div class="top">
      <div class="flag" id="p-flag"></div>
      <div style="min-width:0;flex:1">
        <h2 id="p-name">—</h2>
        <div class="sub" id="p-sub"></div>
      </div>
      <button class="close" id="p-close" aria-label="Close panel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="meta" id="p-meta"></div>
  </div>
  <nav class="tiers" id="tiers" aria-label="Sections"></nav>
  <div class="panel-body" id="p-body"></div>
</aside>

<div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true">
  <button class="x" id="lb-close" aria-label="Close">×</button>
  <div class="frame" id="lb-frame"></div>
  <div class="cap" id="lb-cap"></div>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script src="app.js" type="module"></script>
</body>
</html>
